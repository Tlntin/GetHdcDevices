<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDC Wireless Device Scanner</title>
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem("gethdc.settings") || "{}");
        document.documentElement.setAttribute("data-theme", s.theme || "eclipse");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "eclipse");
      }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Title bar -->
      <header class="topbar">
        <div class="brand">
          <div class="logo">HDC</div>
          <div class="brand-text">
            <h1 data-i18n="brand.h1">Wireless Device Scanner</h1>
            <span class="subtitle" data-i18n="brand.subtitle">Scan the LAN · auto-connect HarmonyOS devices</span>
          </div>
        </div>
        <div class="topbar-right">
          <div id="hdc-status" class="hdc-pill pill-warn" data-i18n-title="hdc.statusTitle" title="hdc status">
            <span class="dot"></span>
            <span id="hdc-status-text" data-i18n="hdc.detecting">Detecting hdc…</span>
          </div>
          <select id="lang-select" class="lang-select" data-i18n-title="lang.title" title="Language"></select>
          <div class="pop-wrap">
            <button id="btn-theme" class="icon-btn" data-i18n-title="theme.toggleTitle" title="Switch theme">◐</button>
            <div id="theme-pop" class="popover hidden">
              <div class="pop-title" data-i18n="theme.popTitle">Theme</div>
              <div id="theme-pop-grid" class="theme-grid"></div>
            </div>
          </div>
          <button id="btn-log" class="icon-btn" data-i18n-title="log.title" title="Debug log">🗒</button>
          <button id="btn-settings" class="icon-btn" data-i18n-title="settings.title" title="Settings">⚙</button>
        </div>
      </header>

      <main class="content">
        <!-- Command bar -->
        <section class="card hero">
          <div class="card-head">
            <h2 data-i18n="discover.h2">Discover devices</h2>
            <span class="muted small" id="scan-hint" data-i18n="discover.hint"></span>
          </div>
          <div class="scan-controls">
            <label class="field grow">
              <span data-i18n="field.iface">Network interface / subnet</span>
              <select id="iface-select"></select>
            </label>
            <label class="field field-sm">
              <span data-i18n="field.ports">Scan ports / range</span>
              <input id="ports-input" type="text" placeholder="10178, 32768-60999" />
            </label>
            <label class="field field-sm">
              <span data-i18n="field.targetIp">Target IP (optional)</span>
              <input id="target-input" type="text" placeholder="192.168.3.155" />
            </label>
            <button id="btn-discover" class="btn btn-primary" data-i18n-title="btn.discoverTitle" title="Native hdc broadcast discovery">
              <span class="btn-label" data-i18n="btn.discover">📡 Broadcast</span>
            </button>
            <button id="btn-scan" class="btn btn-ghost" data-i18n-title="btn.scanTitle" title="TCP port-range scan">
              <span class="btn-label" data-i18n="btn.scan">Port scan</span>
            </button>
            <button id="btn-refresh" class="btn btn-ghost" data-i18n-title="btn.refreshTitle" data-i18n="btn.refresh" title="Refresh connected devices">Refresh</button>
          </div>

          <div id="discover-banner" class="banner hidden">
            <span class="banner-text" id="discover-banner-text"></span>
            <button id="btn-banner-action" class="btn btn-primary btn-sm"></button>
          </div>

          <div id="scan-progress-wrap" class="progress-wrap hidden">
            <div class="progress-track"><div id="scan-bar" class="progress-bar"></div></div>
            <span id="scan-progress-text" class="muted small"></span>
            <button id="btn-stop-scan" class="btn btn-danger btn-sm" data-i18n="btn.stop">Stop</button>
          </div>
        </section>

        <!-- Dashboard: discovery (main) + device state (side) -->
        <div class="dash">
          <div class="dash-main">
            <!-- LAN host discovery -->
            <section class="card">
              <div class="card-head">
                <h2><span data-i18n="host.h2">LAN devices</span> <span id="host-count" class="count-badge">0</span></h2>
                <span class="muted small" data-i18n="host.hint"></span>
              </div>
              <div class="scan-controls compact-controls">
                <button id="btn-host-scan" class="btn btn-primary">
                  <span class="btn-label" data-i18n="btn.hostScan">Scan LAN devices</span>
                </button>
                <button id="btn-scan-all" class="btn btn-ghost" data-i18n="btn.scanAll">Deep-scan all</button>
                <label class="chk">
                  <input type="checkbox" id="only-mobile" checked /> <span data-i18n="chk.onlyMobile">Phone/tablet candidates only</span>
                </label>
              </div>
              <div id="host-progress" class="progress-wrap hidden">
                <div class="progress-track"><div id="host-bar" class="progress-bar"></div></div>
                <span id="host-progress-text" class="muted small"></span>
              </div>
              <div id="host-list" class="list">
                <div class="empty" data-i18n="host.empty"></div>
              </div>
            </section>

            <!-- Scan results -->
            <section class="card">
              <div class="card-head">
                <h2><span data-i18n="found.h2">Scan results</span> <span id="found-count" class="count-badge">0</span></h2>
              </div>
              <span class="muted small head-note" data-i18n="found.note"></span>
              <div id="found-list" class="list">
                <div class="empty" data-i18n="found.empty"></div>
              </div>
            </section>
          </div>

          <div class="dash-side">
            <!-- Manual connect -->
            <section class="card compact">
              <div class="card-head">
                <h2 data-i18n="manual.h2">Manual connect</h2>
              </div>
              <div class="manual-row">
                <label class="field grow">
                  <span data-i18n="field.ipPort">IP:port</span>
                  <input id="manual-input" type="text" placeholder="192.168.3.50:10178" />
                </label>
                <button id="btn-connect-manual" class="btn btn-primary" data-i18n="btn.connect">Connect</button>
              </div>
            </section>

            <!-- Connected devices -->
            <section class="card">
              <div class="card-head">
                <h2><span data-i18n="connected.h2">Connected devices</span> <span id="device-count" class="count-badge">0</span></h2>
                <button id="btn-device-refresh" class="btn btn-ghost btn-sm" style="margin-left:auto" data-i18n-title="btn.refreshTitle" data-i18n="btn.refresh" title="Refresh connected devices">Refresh</button>
                <button id="btn-restart-hdc" class="btn btn-ghost btn-sm" data-i18n-title="btn.resetHdcTitle" data-i18n="btn.resetHdc" title="Restart the hdc service to clear invalid/stuck connections">Reset hdc</button>
              </div>
              <span class="muted small head-note" data-i18n="connected.note"></span>
              <div id="device-list" class="list">
                <div class="empty" data-i18n="connected.empty"></div>
              </div>
            </section>

            <!-- History devices -->
            <section class="card">
              <div class="card-head">
                <h2><span data-i18n="history.h2">History devices</span> <span id="history-count" class="count-badge">0</span></h2>
                <button id="btn-history-refresh" class="btn btn-ghost btn-sm" style="margin-left:auto" data-i18n="btn.refreshOnline">Refresh online status</button>
              </div>
              <span class="muted small head-note" data-i18n="history.note"></span>
              <div id="history-list" class="list">
                <div class="empty" data-i18n="history.empty"></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <h2 data-i18n="settings.title">Settings</h2>
          <button id="btn-settings-close" class="icon-btn">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <span data-i18n="settings.language">Language</span>
            <select id="set-lang" class="lang-select-full"></select>
          </div>
          <div class="field">
            <span data-i18n="settings.theme">Theme</span>
            <div id="theme-grid" class="theme-grid"></div>
          </div>
          <label class="field">
            <span data-i18n="settings.hdcPath">hdc executable path (blank = auto-detect)</span>
            <input id="set-hdc-path" type="text" data-i18n-ph="settings.hdcPathPlaceholder" placeholder="Auto-detect OpenHarmony SDK / PATH" />
          </label>
          <div class="field-grid">
            <label class="field">
              <span data-i18n="settings.defaultPorts">Default scan ports</span>
              <input id="set-ports" type="text" placeholder="10178" />
            </label>
            <label class="field">
              <span data-i18n="settings.wirelessPort">Wireless mode port (tmode)</span>
              <input id="set-wireless-port" type="number" placeholder="10178" />
            </label>
            <label class="field">
              <span data-i18n="settings.timeout">Probe timeout (ms)</span>
              <input id="set-timeout" type="number" placeholder="400" />
            </label>
            <label class="field">
              <span data-i18n="settings.concurrency">Concurrency</span>
              <input id="set-concurrency" type="number" placeholder="256" />
            </label>
            <label class="field">
              <span data-i18n="settings.poll">Online-check interval (s, 0 = off)</span>
              <input id="set-poll" type="number" placeholder="10" />
            </label>
            <label class="field">
              <span data-i18n="settings.connectTimeout">hdc connect timeout (ms)</span>
              <input id="set-connect-timeout" type="number" placeholder="2000" />
            </label>
          </div>
          <label class="chk" style="margin-top:6px">
            <input type="checkbox" id="set-autostart" /> <span data-i18n="settings.autostart">Launch on startup (start minimized to the tray after Windows login)</span>
          </label>
          <div id="hdc-detail" class="hdc-detail muted small"></div>
        </div>
        <div class="modal-foot">
          <button id="btn-redetect" class="btn btn-ghost" data-i18n="btn.redetect">Re-detect hdc</button>
          <button id="btn-settings-save" class="btn btn-primary" data-i18n="btn.save">Save</button>
        </div>
      </div>
    </div>

    <!-- Device detail / connect modal -->
    <div id="device-modal" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-head">
          <h2 id="dm-title" data-i18n="dm.title">Device details</h2>
          <button id="dm-close" class="icon-btn">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <span data-i18n="dm.name">Device name</span>
            <div id="dm-name" class="dm-ro"></div>
          </div>
          <div class="field-grid">
            <label class="field">
              <span data-i18n="dm.ip">IP address</span>
              <input id="dm-ip" type="text" placeholder="192.168.3.x" />
            </label>
            <label class="field">
              <span data-i18n="dm.port">Port (auto-filled from the last connection)</span>
              <input id="dm-port" type="text" data-i18n-ph="dm.portPlaceholder" placeholder="e.g. 38789" />
            </label>
          </div>
          <div class="field">
            <span data-i18n="dm.mac">MAC</span>
            <div id="dm-mac" class="dm-ro"></div>
          </div>
          <label class="field">
            <span data-i18n="dm.note">Note (custom name, bound to MAC)</span>
            <input id="dm-note" type="text" data-i18n-ph="dm.notePlaceholder" placeholder="Give this device a name" />
          </label>
          <div id="dm-extra" class="muted small"></div>
        </div>
        <div class="modal-foot">
          <button id="dm-delete" class="btn btn-ghost" data-i18n="btn.delete">Delete</button>
          <span style="flex:1"></span>
          <button id="dm-save" class="btn btn-ghost" data-i18n="btn.save">Save</button>
          <button id="dm-connect" class="btn btn-primary" data-i18n="btn.connect">Connect</button>
        </div>
      </div>
    </div>

    <!-- Debug log modal -->
    <div id="log-modal" class="modal-overlay hidden">
      <div class="modal modal-lg">
        <div class="modal-head">
          <h2 data-i18n="log.title">Debug log</h2>
          <div style="display:flex; gap:8px; align-items:center">
            <button id="btn-log-copy" class="btn btn-ghost btn-sm" data-i18n="log.copy">Copy</button>
            <button id="btn-log-clear" class="btn btn-ghost btn-sm" data-i18n="log.clear">Clear</button>
            <button id="btn-log-close" class="icon-btn">✕</button>
          </div>
        </div>
        <div id="log-body" class="log-body"></div>
      </div>
    </div>

    <div id="toast-area" class="toast-area"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
